name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        run: sed -n '/<script type="module">/,/<\\/script>/p' index.html | sed '1d;$d' > /tmp/pixelworld.mjs && node --check /tmp/pixelworld.mjs
      - name: Validate game data JSON
        run: for file in data/*.json manifest.webmanifest; do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"; done
      - name: Run engine tests
        run: npm test
