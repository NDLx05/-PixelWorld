name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        run: awk 'index($0, "<script type=\"module\">"){flag=1;next} index($0, "</script>"){flag=0;next} flag' index.html > /tmp/pixelworld.mjs && test -s /tmp/pixelworld.mjs && node --check /tmp/pixelworld.mjs
      - name: Validate game data JSON
        run: for file in data/*.json data/maps/*.json manifest.webmanifest; do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"; done
      - name: Run engine tests
        run: npm test
